services:
  whisper:
    container_name: faster-whisper-rocm
    restart: unless-stopped
    build:
      context: .
      args:
        AMDGPU_TARGETS: ${AMDGPU_TARGETS:-}
    image: wyoming-faster-whisper-rocm
    volumes:
      - ./data:/data
    ports:
      - "10300:10300"
    devices:
      - "/dev/dri"
      - "/dev/kfd"
    environment:
      WYOMING_DATA_DIRS: /data
      WYOMING_MODEL: medium
      WYOMING_COMPUTE_TYPE: int8
